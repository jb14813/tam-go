[workspace]
members = ["crates/core", "crates/server", "crates/client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
getrandom = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
thiserror = "2"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
mdns-sd = "0.18"
if-addrs = "0.15"
fs2 = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
axum = { version = "0.8", features = ["multipart", "form", "json", "http1", "tokio"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http-body = "1"
bcrypt = "0.17"
minijinja = { version = "2", features = ["builtins", "json"] }
url = "2"
form_urlencoded = "1"
hmac = "0.12"
subtle = "2"
log = { version = "0.4", features = ["std"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime = "0.3"
