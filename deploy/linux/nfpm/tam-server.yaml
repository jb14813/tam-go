# The .deb and .rpm of tam-server, built by nfpm (https://nfpm.goreleaser.com)
# from build.sh, which fills in @ARCH@, @VERSION@ and @PRERELEASE@ and puts
# the unit and the scripts for this program under build/pkg/tam-server.
name: tam-server
arch: @ARCH@
platform: linux
version: @VERSION@
prerelease: "@PRERELEASE@"
release: "1"
section: net
priority: optional
maintainer: Ticket Auction Manager <https://github.com/ticket-auction-manager/tam-go>
vendor: ticket-auction-manager
homepage: https://github.com/ticket-auction-manager/tam-go
license: MIT
description: |
  Ticket Auction Manager server.
  The shared database of an event: the clients running tam-client pair with
  it and keep working when it is away. Runs as the tam-server service on
  port 8000; the admin page at http://<host>:8000/admin sets the password.
contents:
  - src: build/linux-@ARCH@/tam-server
    dst: /usr/bin/tam-server
    file_info:
      mode: 0755
  - src: build/pkg/tam-server/tam-server.service
    dst: /usr/lib/systemd/system/tam-server.service
    file_info:
      mode: 0644
  - src: cmd/tam-server/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/tam-server.svg
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/tam-server/README.md
    file_info:
      mode: 0644
  - src: LICENSE.md
    dst: /usr/share/doc/tam-server/LICENSE.md
    file_info:
      mode: 0644
scripts:
  preinstall: build/pkg/tam-server/preinstall.sh
  postinstall: build/pkg/tam-server/postinstall.sh
  preremove: build/pkg/tam-server/preremove.sh
  postremove: build/pkg/tam-server/postremove.sh
