name: release

# A pushed version tag (1.2.3, v1.2.3, 1.2.3-rc1) builds every package with
# build.sh and attaches them to a GitHub release of that tag; a tag with a
# hyphen is marked as a pre-release.
on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the web app and the archives for every system
        run: VERSION="$GITHUB_REF_NAME" ./build.sh release

      - name: Create the GitHub release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # The description: docs/release-notes.md with the version filled in,
          # then the list of changes GitHub generates.
          sed -e "s#{VERSION}#$GITHUB_REF_NAME#g" -e "s#{REPO}#$GITHUB_REPOSITORY#g" docs/release-notes.md > build/release-notes.md
          printf '\n## Changes\n\n' >> build/release-notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body >> build/release-notes.md
          gh release create "$GITHUB_REF_NAME" $pre --title "Ticket Auction Manager $GITHUB_REF_NAME" --notes-file build/release-notes.md \
            build/tam-server-*.exe build/tam-client-*.exe \
            build/tam-server-*.zip build/tam-server-*.tar.gz build/tam-client-*.zip build/tam-client-*.tar.gz \
            build/*.deb build/*.rpm
