name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the web app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Cross-compile check (every release target)
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go vet ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

  compat:
    name: Compatibility with the original tam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the web app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Original server with the Go client, then the Go server with both clients
        run: bash scripts/compat/run.sh

  load:
    name: Race detector and load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the web app
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tests with the race detector
        run: go test -race ./...

      - name: Load test with the race detector (12 clients, the server killed during ticket entry)
        run: |
          mkdir -p "$RUNNER_TEMP/tam"
          go build -race -o "$RUNNER_TEMP/tam/" ./cmd/tam-server ./cmd/tam-client
          go run -race ./scripts/loadtest -bin "$RUNNER_TEMP/tam" -clients 12 -tickets 3000 -baskets 500 -entry 20s -outage 5s -rush 5s

  nix:
    name: Nix package and NixOS test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Let the NixOS test use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Package (the web app and both programs, with the unit tests)
        run: nix build -L

      - name: NixOS test (a server, a client that pairs with it, and an HTTPS server)
        run: nix flake check -L
