# The client deployment, bound to the local machine only.
#
#   docker compose -f compose.client.yml up -d
services:
  tam-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: tam-go/tam-client:latest
    restart: unless-stopped
    volumes:
      - "./data-client:/data"
    ports:
      - "127.0.0.1:3080:3080"
