<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<!-- data-sveltekit-reload: every link is a full page load, as in the original.
	     That resets page state per prefix and lets the forms save pending rows on unload. -->
	<body data-sveltekit-reload>
		<div style="display: contents" data-sveltekit-preload-data="off">%sveltekit.body%</div>
	</body>
</html>
