# The server deployment: tam-server behind a Caddy reverse proxy that
# terminates TLS on 8443 with a self-signed certificate, as the original.
#
#   TAM_PWD=change-this docker compose up -d
services:
  tam-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: tam-go/tam-server:latest
    restart: unless-stopped
    environment:
      - "TAM_PWD=${TAM_PWD:-changeme}"
    volumes:
      - "./data:/data"
    ports:
      - "8000:8000"
  tam-rp:
    build: ./rp
    image: tam-go/tam-rp:latest
    restart: unless-stopped
    environment:
      - "TAM_SERVER=tam-server"
    ports:
      - "8443:8443"
